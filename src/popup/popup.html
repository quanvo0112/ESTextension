<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --bg: #f4f5fb;
      --card: #ffffff;
      --text: #1f2333;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #16a34a;
      --success-bg: #ecfdf5;
      --error: #dc2626;
      --error-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
    }

    .container {
      background: var(--card);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 35, 51, 0.08);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo svg {
      width: 18px;
      height: 18px;
    }

    h2 {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
    }

    .subtitle {
      margin: 1px 0 0;
      font-size: 11px;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .select-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    select {
      width: 100%;
      padding: 10px 32px 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--text);
      font-size: 13px;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:hover {
      border-color: var(--accent);
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .select-wrap::after {
      content: '';
      position: absolute;
      right: 12px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    button {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.45);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-top-color: white;
      border-radius: 50%;
      display: none;
      animation: spin 0.7s linear infinite;
    }

    button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      margin-top: 12px;
      padding: 9px 10px;
      font-size: 12px;
      text-align: center;
      color: var(--muted);
      border-radius: 8px;
      min-height: 14px;
      transition: all 0.2s;
    }

    #status:empty {
      display: none;
    }

    #status.success {
      color: var(--success);
      background: var(--success-bg);
      font-weight: 600;
    }

    #status.error {
      color: var(--error);
      background: var(--error-bg);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="16" rx="2" stroke="white" stroke-width="2"/>
          <path d="M3 9H21" stroke="white" stroke-width="2"/>
          <path d="M9 9V20" stroke="white" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <h2>Table Extractor</h2>
        <p class="subtitle">Trích xuất bảng nhanh</p>
      </div>
    </div>

    <label for="fileType">Định dạng xuất</label>
    <div class="select-wrap">
      <select id="fileType">
        <option value="json">JSON Format</option>
        <option value="txt">Text Format</option>
      </select>
    </div>

    <button id="extractButton">
      <span class="spinner"></span>
      <span class="btn-label">Extract Table</span>
    </button>

    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
